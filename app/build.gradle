plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mynativeapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mynativeapp"
        minSdk 21
        targetSdk 34

        // =========================================================================
        // === BISA KAMU UBAH DI SINI (VERSI APLIKASI) =============================
        // =========================================================================
        versionCode 1
        versionName "1.0"
        // =========================================================================

        externalNativeBuild {
            cmake {
                cppFlags "-O2 -fvisibility=hidden" // -O2 untuk optimasi & menyembunyikan simbol
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true // Mengaktifkan obfuskasi kode Java
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
